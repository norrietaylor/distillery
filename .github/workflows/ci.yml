name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Install from uv.lock (not a fresh pip resolve) so CI tests exactly the
      # dependency set that ships — Dependabot lock bumps auto-merge on this
      # check. --locked fails on a stale lock; --no-sync stops later steps
      # from re-resolving. The otel extra is included because the image ships it.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra otel

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/

      - name: Type check (mypy)
        run: uv run --no-sync mypy --strict src/

      - name: Test (pytest + coverage)
        run: uv run --no-sync pytest -m "not bench" --cov=src/distillery --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
